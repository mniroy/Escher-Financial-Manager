<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escher Financial Manager</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#4f46e5" />
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="icon" type="image/png" href="/icon-512.png">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f3f4f6;
      font-family: 'Inter', sans-serif;
      margin: 0;
      overflow: hidden;
    }

    /* Inline splash screen that shows immediately */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #4338ca 100%);
      transition: opacity 0.5s ease-out;
    }

    #splash-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: bounce 2s infinite;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .splash-logo svg {
      width: 48px;
      height: 48px;
      color: white;
    }

    .splash-title {
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin: 0 0 8px;
      letter-spacing: -0.025em;
    }

    .splash-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin: 0 0 32px;
    }

    .splash-dots {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .splash-dot {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: bounce 0.6s infinite;
    }

    .splash-dot:nth-child(2) {
      animation-delay: 0.15s;
    }

    .splash-dot:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    /* Background circles */
    .splash-bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: pulse 4s infinite;
    }

    .splash-bg-circle.c1 {
      width: 320px;
      height: 320px;
      top: -160px;
      right: -160px;
    }

    .splash-bg-circle.c2 {
      width: 256px;
      height: 256px;
      bottom: -128px;
      left: -128px;
      animation-duration: 5s;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.05);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>

<body>
  <!-- Inline splash screen - shows immediately before React loads -->
  <div id="splash-screen">
    <div class="splash-bg-circle c1"></div>
    <div class="splash-bg-circle c2"></div>
    <div class="splash-content">
      <div class="splash-logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 2L28.1 9V23L16 30L3.9 23V9L16 2Z" stroke="currentColor" stroke-width="2" fill="none" />
          <path d="M16 2V16M16 16L28.1 9M16 16L3.9 9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </div>
      <h1 class="splash-title">Escher</h1>
      <p class="splash-subtitle">Financial Manager</p>
      <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Hide splash when React app is ready
    window.hideSplash = function () {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 500);
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('SW registered: ', registration);
          })
          .catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
      });
    }
  </script>
</body>

</html>
